# Default task config template:
#
# [[tasks]]
# name = "my_task_name"                         # Framework config: unique task name.
# script_path = "tasks/shared/my_task.py"       # Framework config: Python task script.
# cron_setting = "0 14 * * *"                  # Optional: GitHub Actions cron in UTC.
# gcp_auth = true                              # Framework config: enable GCP auth in workflow.
#
# Optional date-window defaults. Ignore these if your task does not need dates.
# The framework interprets offsets from today's date in New York time.
# start_date_offset = -30
# end_date_offset = -1
#
# Optional manual run inputs. Add these when you want workflow_dispatch overrides.
# startdate/enddate are framework-defined input names that get converted into
# start_date_offset/end_date_offset in New York time before your script runs.
# manual_overrides = [
#     { name = "startdate", path = "start_date_offset", description = "Start date, YYYY-MM-DD. Converted to start_date_offset using New York time." },
#     { name = "enddate", path = "end_date_offset", description = "End date, YYYY-MM-DD. Converted to end_date_offset using New York time." },
# ]
#
# Add any extra config your script needs below these framework fields, for example:
# Include sheet_id/tab_name only when your task uses Google Sheets.
# sheet_id = "..."
# tab_name = "..."
# sheet_write_mode = "replace"
#
# This file only controls workflow generation. Each task's actual behavior lives
# in its Python script under tasks/.
#
# cron_setting is UTC, because that is how GitHub Actions interprets it, and it
# does not follow daylight saving. The values below target roughly 12:30 in the
# US Eastern afternoon: 16:3x UTC is 12:3x EDT in summer and 11:3x EST in winter.
# To hold the Eastern wall clock steady, shift these by an hour at each DST
# change (2026: Mar 8 and Nov 1).

[[tasks]]
name = "jsonplaceholder_posts"
script_path = "tasks/demo/jsonplaceholder_posts.py"
cron_setting = "28 16 * * *"
sheet_id = "1WJKbiYBgNqkvRIxaXJX5V12nqKHfAT9t6Z3vpVjAdVU"
tab_name = "jsonplaceholder_posts"
gcp_auth = true
api_endpoint = "https://jsonplaceholder.typicode.com/posts"
api_query = { userId = 1 }
api_timeout_seconds = 30
dlt_pipeline_name = "jsonplaceholder_posts_pipeline"
dlt_dataset_name = "jsonplaceholder"
dlt_table_name = "posts"
dlt_write_disposition = "replace"
sheet_write_mode = "replace"

