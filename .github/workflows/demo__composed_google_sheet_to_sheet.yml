# Generated by scripts/generate_workflows.py
name: "demo / composed_google_sheet_to_sheet"

on:
  workflow_dispatch:
    inputs:
      source_range:
        description: "A1 range to copy, for example source_tab!A:F"
        required: false
        type: string
      startdate:
        description: "Start date, YYYY-MM-DD. Converted to start_date_offset using New York time."
        required: false
        type: string
      enddate:
        description: "End date, YYYY-MM-DD. Converted to end_date_offset using New York time."
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  run-demo-composed-google-sheet-to-sheet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Run composed_google_sheet_to_sheet
        id: run_task
        shell: bash
        env:
          TASK_LOG: task.log
          EDGERUNNER_OVERRIDE_SOURCE_RANGE: ${{ github.event.inputs.source_range || '' }}
          EDGERUNNER_OVERRIDE_STARTDATE: ${{ github.event.inputs.startdate || '' }}
          EDGERUNNER_OVERRIDE_ENDDATE: ${{ github.event.inputs.enddate || '' }}
        run: |
          set +e
          python tasks/demo/composed_google_sheet_to_sheet.py --task-name composed_google_sheet_to_sheet 2>&1 | tee "$TASK_LOG"
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Send Slack alert
        if: always()
        run: |
          python scripts/send_slack_alert.py \
            --webhook-url "${{ secrets.SLACK_WEBHOOK_URL }}" \
            --task-name "composed_google_sheet_to_sheet" \
            --task-outcome "${{ steps.run_task.outcome || 'not_run' }}" \
            --task-exit-code "${{ steps.run_task.outputs.exit_code || 'unknown' }}" \
            --job-status "${{ job.status }}" \
            --task-log task.log \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --repository "${{ github.repository }}" \
            --workflow-name "${{ github.workflow }}" \
            --branch-name "${{ github.ref_name }}" \
            --trigger "${{ github.event_name }}"
