# Generated by scripts/generate_workflows.py
name: google_sheet_to_sheet

on:
  workflow_dispatch:
    inputs:
      source_range:
        description: "A1 range to copy, for example source_tab!A:F"
        required: false
        type: string
      startdate:
        description: "Start date, YYYY-MM-DD. Converted to start_date_offset using New York time."
        required: false
        type: string
      enddate:
        description: "End date, YYYY-MM-DD. Converted to end_date_offset using New York time."
        required: false
        type: string
  schedule:
    - cron: "33 16 * * *"

permissions:
  contents: read
  id-token: write

jobs:
  run-google-sheet-to-sheet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Restore dlt state
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .dlt
            *.duckdb
            *.duckdb.wal
          key: dlt-${{ runner.os }}-google_sheet_to_sheet-${{ github.run_id }}
          restore-keys: |
            dlt-${{ runner.os }}-google_sheet_to_sheet-

      - name: Run google_sheet_to_sheet
        env:
          EDGERUNNER_OVERRIDE_SOURCE_RANGE: ${{ github.event.inputs.source_range || '' }}
          EDGERUNNER_OVERRIDE_STARTDATE: ${{ github.event.inputs.startdate || '' }}
          EDGERUNNER_OVERRIDE_ENDDATE: ${{ github.event.inputs.enddate || '' }}
        run: python tasks/google_sheet_to_sheet.py --task-name google_sheet_to_sheet
