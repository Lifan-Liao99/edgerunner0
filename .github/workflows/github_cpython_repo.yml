# Generated by scripts/generate_workflows.py
name: github_cpython_repo

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read
  id-token: write

jobs:
  run-github-cpython-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Restore dlt state
        uses: actions/cache@v4
        with:
          path: |
            .dlt
            *.duckdb
            *.duckdb.wal
          key: dlt-${{ runner.os }}-github_cpython_repo-${{ github.run_id }}
          restore-keys: |
            dlt-${{ runner.os }}-github_cpython_repo-

      - name: Run github_cpython_repo
        run: python tasks/github_cpython_repo.py
