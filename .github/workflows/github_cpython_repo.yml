# Generated by scripts/generate_workflows.py
name: github_cpython_repo

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read
  id-token: write

jobs:
  run-github-cpython-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Restore dlt state
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .dlt
            *.duckdb
            *.duckdb.wal
          key: dlt-${{ runner.os }}-github_cpython_repo-${{ github.run_id }}
          restore-keys: |
            dlt-${{ runner.os }}-github_cpython_repo-

      - name: Run github_cpython_repo
        run: python tasks/github_cpython_repo.py --task-name github_cpython_repo
